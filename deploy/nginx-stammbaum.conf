# The host's nginx in front of the container, with Authelia deciding who gets in.
# Copy to /etc/nginx/sites-available/, adjust the domain and certificate paths,
# link it into sites-enabled/ and `nginx -t && systemctl reload nginx`.
#
# The two snippets are the ones from Authelia's nginx guide
# (https://www.authelia.com/integration/proxies/nginx/) that every other
# protected site on the host already includes:
#   authelia-location.conf     the internal /internal/authelia/authz endpoint
#   authelia-authrequest.conf  auth_request on it, 401 → redirect to the portal
#
# Everything behind this — the page, api/family, api/edits, photos/ — goes
# through the same login. The server trusts the Remote-User header set below to
# say who is editing, which is why it only listens on the loopback.

server {
    listen 80;
    listen [::]:80;
    server_name stammbaum.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name stammbaum.example.com;

    ssl_certificate     /etc/letsencrypt/live/stammbaum.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stammbaum.example.com/privkey.pem;

    include /etc/nginx/snippets/authelia-location.conf;

    location / {
        include /etc/nginx/snippets/authelia-authrequest.conf;

        # Tells the page who logged in, so it captions everyone from their point
        # of view: the person with a matching `login=` in family.md. $user comes
        # from the snippet's `auth_request_set $user $upstream_http_remote_user;`.
        # Only a label, not a credential — changing it changes the captions.
        # (An add_header here stops this location inheriting the server's own
        # add_header lines; repeat any you rely on, such as HSTS.)
        add_header Set-Cookie "stammbaum_login=$user; Path=/; Secure; SameSite=Lax" always;

        # Who logged in, for the server: it decides who may edit and signs every
        # change with it. Set here, it replaces anything the browser sent, and an
        # empty value drops the header — so nobody can claim to be someone else.
        proxy_set_header Remote-User $user;

        # docker-compose.yml only publishes the container on the loopback.
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
